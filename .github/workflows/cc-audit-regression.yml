name: Common Criteria security regression

on:
  workflow_dispatch:
  push:
    branches:
      - work
  pull_request:
    paths:
      - 'dhis-2/dhis-support/dhis-support-audit/**'
      - 'dhis-2/dhis-support/dhis-support-artemis/**'
      - 'dhis-2/dhis-services/dhis-service-audit-consumer/**'
      - 'dhis-2/dhis-test-integration/src/test/java/org/hisp/dhis/audit/**'
      - 'dhis-2/pom.xml'
      - 'dhis-2/dhis-api/src/main/java/org/hisp/dhis/security/**'
      - 'dhis-2/dhis-api/src/main/java/org/hisp/dhis/user/**'
      - 'dhis-2/dhis-api/src/main/java/org/hisp/dhis/audit/**'
      - 'dhis-2/dhis-services/dhis-service-acl/**'
      - 'dhis-2/dhis-support/dhis-support-external/**'
      - 'dhis-2/dhis-support/dhis-support-hibernate/**'
      - 'dhis-2/dhis-support/dhis-support-db-migration/**'
      - 'dhis-2/dhis-test-integration/src/test/java/org/hisp/dhis/security/**'
      - 'dhis-2/dhis-support/dhis-support-test/**'
      - 'dhis-2/dhis-web-api/**'
      - 'dhis-2/dhis-test-web-api/**'
      - 'dhis-2/dhis-services/dhis-service-core/**'
      - 'docs/security/**'
      - '.github/workflows/cc-audit-regression.yml'

permissions:
  contents: read

jobs:
  afta-traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate selected AFTA checklist and evidence traces
        run: |
          python3 docs/security/tools/render_afta_selected_review.py --check
          python3 docs/security/tools/render_afta_traceability.py --check
          python3 -m unittest discover -s docs/security/tools -p 'test_afta_traceability.py'

  audit-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: dhis-2/pom.xml
      - name: Verify Docker for Testcontainers
        run: docker info
      - name: Execute audit compression unit tests
        working-directory: dhis-2
        run: |
          mvn -B -ntp -pl dhis-support/dhis-support-audit -am -Punit-test \
            -Dtest=JdbcAuditRepositoryCompressionTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test
      - name: Verify explicit encryption-key startup policy
        working-directory: dhis-2
        run: |
          mvn -B -ntp -pl dhis-support/dhis-support-hibernate -am -Punit-test \
            -Dtest=HibernateEncryptionPolicyTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Execute audit write-failure propagation tests
        working-directory: dhis-2
        run: |
          mvn -B -ntp -pl dhis-services/dhis-service-audit-consumer -am -Punit-test \
            -Dtest=DefaultAuditServiceFailureTest,AbstractAuditConsumerFailureTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test
      - name: Execute Artemis audit broker and external TLS tests
        working-directory: dhis-2
        run: |
          mvn -B -ntp -pl dhis-support/dhis-support-artemis -am -Punit-test \
            -Dtest=ArtemisAuditBrokerIntegrationTest,ArtemisAuditRedeliveryTest,AuditSchedulerTest,ExternalArtemisConnectionFactoryTest,ArtemisExternalTlsIntegrationTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test
      - name: Execute PostgreSQL audit regression tests
        working-directory: dhis-2
        run: |
          mvn -B -ntp -pl dhis-test-integration -am -Pintegration-test \
            -Dtest=AuditRepositoryTest,AuditRepositoryFailureRecoveryTest,AuditStorageDeliveryRecoveryTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test
      - name: Verify PostgreSQL two-factor replay reservations
        working-directory: dhis-2
        run: |
          mvn -B -ntp -pl dhis-test-integration -am -Pintegration-test \
            -Dtest=TwoFactorReplayPostgresTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Verify all required audit and replay test classes actually executed
        if: success()
        working-directory: dhis-2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              "org.hisp.dhis.audit.JdbcAuditRepositoryCompressionTest",
              "org.hisp.dhis.config.HibernateEncryptionPolicyTest",
              "org.hisp.dhis.audit.AuditRepositoryTest",
              "org.hisp.dhis.audit.AuditRepositoryFailureRecoveryTest",
              "org.hisp.dhis.audit.AuditStorageDeliveryRecoveryTest",
              "org.hisp.dhis.audit.DefaultAuditServiceFailureTest",
              "org.hisp.dhis.audit.AbstractAuditConsumerFailureTest",
              "org.hisp.dhis.artemis.config.ArtemisAuditBrokerIntegrationTest",
              "org.hisp.dhis.artemis.config.ArtemisAuditRedeliveryTest",
              "org.hisp.dhis.artemis.config.ExternalArtemisConnectionFactoryTest",
              "org.hisp.dhis.artemis.config.ArtemisExternalTlsIntegrationTest",
              "org.hisp.dhis.artemis.audit.AuditSchedulerTest",
              "org.hisp.dhis.security.twofa.TwoFactorReplayPostgresTest",
          }
          seen = {}
          for report in Path(".").rglob("target/surefire-reports/TEST-*.xml"):
              root = ET.parse(report).getroot()
              name = root.attrib.get("name", "")
              if name not in expected:
                  continue
              tests = int(root.attrib.get("tests", 0))
              failures = int(root.attrib.get("failures", 0))
              errors = int(root.attrib.get("errors", 0))
              skipped = int(root.attrib.get("skipped", 0))
              if tests <= skipped or failures or errors:
                  raise SystemExit(
                      f"Invalid test result for {name}: "
                      f"tests={tests}, skipped={skipped}, failures={failures}, errors={errors}"
                  )
              seen[name] = (tests, skipped)
          missing = expected - seen.keys()
          if missing:
              raise SystemExit(f"Required test reports missing: {sorted(missing)}")
          print(f"Verified audit test reports: {seen}")
          PY
      - name: Publish test XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc-audit-surefire-reports
          path: |
            dhis-2/**/target/surefire-reports/*.xml
            dhis-2/**/target/surefire-reports/*.txt
          if-no-files-found: warn

  authentication-web:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: dhis-2/pom.xml
      - name: Verify token state, request isolation and browser protection units
        working-directory: dhis-2
        run: |
          mvn -B -ntp -pl dhis-web-api -am -Punit-test \
            -Dtest=TwoFactorAuthenticationPolicyTest,AuthenticationAuditRecordTest,ApiTokenAuthManagerTest,ApiTokenResolverTest,CspFilterTest,LoginConfigCorsFilterTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Verify authentication and session web regressions with H2
        working-directory: dhis-2
        run: |
          mvn -B -ntp -pl dhis-test-web-api -am -Pintegration-h2-test \
            -Dtest=TwoFactorReplayServiceTest,ApiTokenAuthenticationTest,ApiTokenStateAuthenticationTest,TwoFactorLoginPolicyTest,TwoFactorQrStabilityTest,TwoFactorControllerTest,UserTwoFactorAuditControllerTest,AuthenticationControllerTest,LoginConfigCorsTest,SessionControllerTest,UserRoleSessionInvalidationControllerTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Verify required authentication and web reports actually executed
        working-directory: dhis-2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              "org.hisp.dhis.security.spring2fa.TwoFactorAuthenticationPolicyTest",
              "org.hisp.dhis.security.AuthenticationAuditRecordTest",
              "org.hisp.dhis.webapi.controller.security.TwoFactorLoginPolicyTest",
              "org.hisp.dhis.webapi.controller.security.TwoFactorQrStabilityTest",
              "org.hisp.dhis.webapi.controller.TwoFactorControllerTest",
              "org.hisp.dhis.webapi.controller.UserTwoFactorAuditControllerTest",
              "org.hisp.dhis.security.twofa.TwoFactorReplayServiceTest",
              "org.hisp.dhis.webapi.security.apikey.ApiTokenAuthManagerTest",
              "org.hisp.dhis.webapi.security.apikey.ApiTokenResolverTest",
              "org.hisp.dhis.webapi.filter.CspFilterTest",
              "org.hisp.dhis.webapi.filter.LoginConfigCorsFilterTest",
              "org.hisp.dhis.webapi.security.ApiTokenAuthenticationTest",
              "org.hisp.dhis.webapi.security.ApiTokenStateAuthenticationTest",
              "org.hisp.dhis.webapi.controller.security.AuthenticationControllerTest",
              "org.hisp.dhis.webapi.security.LoginConfigCorsTest",
              "org.hisp.dhis.webapi.controller.security.SessionControllerTest",
              "org.hisp.dhis.webapi.controller.UserRoleSessionInvalidationControllerTest",
          }
          seen = set()
          for report in Path(".").rglob("target/surefire-reports/TEST-*.xml"):
              root = ET.parse(report).getroot()
              name = root.attrib.get("name", "")
              if name not in expected:
                  continue
              tests = int(root.attrib.get("tests", 0))
              skipped = int(root.attrib.get("skipped", 0))
              failures = int(root.attrib.get("failures", 0))
              errors = int(root.attrib.get("errors", 0))
              if tests <= skipped or failures or errors:
                  raise SystemExit(f"Invalid test result for {name}: {root.attrib}")
              seen.add(name)
          if missing := expected - seen:
              raise SystemExit(f"Required test reports missing: {sorted(missing)}")
          print(f"Verified {len(seen)} authentication/web test classes")
          PY
      - name: Publish authentication and web XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc-authentication-web-surefire-reports
          path: |
            dhis-2/**/target/surefire-reports/*.xml
            dhis-2/**/target/surefire-reports/*.txt
          if-no-files-found: warn
