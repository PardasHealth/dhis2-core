#-- Application and help introductions ---------------------------------------#
intro_dhis-web-dataentry=داده‌ها را به‌صورت برخط یا برون‌خط در فرم‌ها وارد کنید، اعتبارسنجی کنید و روند تغییرات را ببینید.
intro_dhis-web-import-export=داده‌ها را در قالب‌های مختلف میان DHIS2 و سامانه‌های دیگر درون‌ریزی یا برون‌ریزی کنید.
intro_dhis-web-validationrule=کیفیت داده‌ها را با قواعد اعتبارسنجی یا روش‌های آماری بررسی و ارزیابی کنید.
intro_dhis-web-light=به نسخه بهینه‌شده ورود و تحلیل داده‌ها برای دستگاه‌های همراه دسترسی پیدا کنید.
intro_dhis-web-mobile=به نسخه بهینه‌شده برای تلفن هوشمند شامل ورود داده‌ها، تنظیمات و پیام‌ها دسترسی پیدا کنید.
intro_dhis-web-dashboard-integration=نمودارها، گزارش‌ها و نقشه‌های منتخب را مرور کنید و پیام‌ها را ببینید یا ارسال کنید.
intro_dhis-web-dashboard=نمودارها، جدول‌ها و نقشه‌های منتخب را مرور کنید و پیام‌ها را ببینید یا ارسال کنید.
intro_dhis-web-visualizer=برای عناصر داده و شاخص‌ها نمایش‌های تصویری پویا ایجاد کنید.
intro_dhis-web-pivot=جدول‌های محوری انعطاف‌پذیر با داده‌های تجمیع‌شده در همه ابعاد ایجاد کنید.
intro_dhis-web-sms=یادآوری‌ها و اعلان‌های پیامکی را به‌صورت دستی یا زمان‌بندی‌شده ارسال کنید.
intro_dhis-web-event-reports=رویدادها را جستجو کنید و تحلیل‌های تجمیعی و چندبعدی بسازید.
intro_dhis-web-event-capture=اطلاعات مربوط به رویدادهای منفرد را ثبت کنید.
intro_dhis-web-capture=اطلاعات مربوط به رویدادهای منفرد را ثبت کنید.
intro_dhis-web-data-visualizer=برای عناصر داده و شاخص‌ها نمایش‌های تصویری پویا ایجاد کنید.
intro_dhis-web-sms-configuration=درگاه‌های پیامک و پیام‌ها را پیکربندی کنید.
intro_dhis-web-line-listing=فهرست‌های پویای رویدادها و موجودیت‌های ردیابی‌شده را ایجاد کنید.
intro_help_center=برای راه‌اندازی و استفاده از DHIS2 در موضوعات مختلف راهنما دریافت کنید.
intro_supportive_software=با نرم‌افزارهای کاربردی مانند ابزارهای طراحی گزارش و برنامه‌های تلفن همراه آشنا شوید.
intro_system_overview=برای مشاهده فهرست کامل ماژول‌ها به صفحه نمای کلی سامانه بروید.
intro_web_api=به نقطه ورود وب API برای ارتباط با سامانه‌های رایانه‌ای دیگر بروید.
intro_about_dhis2=اطلاعات نسخه سامانه و محیط اجرای آن را مشاهده کنید.
intro_settings=ترجیحات شخصی خود را برای زبان رابط کاربری، ظاهر و تنظیمات ایمیل تعیین کنید.
intro_profile=نمایه شخصی خود را با اطلاعاتی مانند عنوان شغلی و علایق تکمیل کنید.
intro_account=حساب کاربری خود شامل نام، رمز عبور، ایمیل و شماره تلفن همراه را مدیریت کنید.
intro_log_out=برای خروج از سامانه و جلوگیری از دسترسی دیگران به حساب کاربری خود به این بخش بروید.
